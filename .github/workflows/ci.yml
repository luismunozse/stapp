name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    env:
      # Mock env vars para que el build pase sin servicios reales
      NEXT_PUBLIC_SUPABASE_URL: 'https://mock.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'mock-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'mock-service-role-key'
      NEXTAUTH_SECRET: 'mock-secret-for-ci-build'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_ROOT_DOMAIN: 'stapp.com.ar'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: PDF render smoke (production bundle)
        run: node scripts/pdf-smoke.mjs
        env:
          PDF_SMOKE: '1'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://mock.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'mock-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'mock-service-role-key'
      NEXTAUTH_SECRET: 'mock-secret-for-ci-build'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_ROOT_DOMAIN: 'localhost'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
